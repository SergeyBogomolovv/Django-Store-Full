services:
  web:
    environment:
      DJANGO_HTTPS: "1"

  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:?Set the tunnel token in .env}
    depends_on:
      - nginx
    restart: unless-stopped
